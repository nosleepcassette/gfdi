name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:release
      - run: npm run build
      - run: npm pack --dry-run
